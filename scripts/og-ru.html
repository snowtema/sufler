<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Исходник OG-картинки (1200×630). Перерисовать: см. README, раздел «SEO». -->
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #e4e7eb; font-family: "Onest", sans-serif; color: #15171b; display: grid; grid-template-columns: 590px 1fr; align-items: center; padding: 0 64px 0 72px; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 16px; font: 600 38px/1 "Unbounded", sans-serif; letter-spacing: -0.02em; }
  .tally { width: 20px; height: 20px; border-radius: 50%; background: #ef3a2d; box-shadow: 0 0 0 6px rgba(239, 58, 45, 0.18), 0 0 22px rgba(239, 58, 45, 0.45); }
  h1 { margin-top: 44px; font-weight: 600; font-size: 56px; line-height: 1.08; letter-spacing: -0.025em; }
  p { margin-top: 24px; font-size: 25px; line-height: 1.4; color: #4a5059; }
  .url { margin-top: 40px; font-size: 21px; color: #6b727c; }
  .monitor { display: flex; flex-direction: column; align-items: center; }
  .body { position: relative; width: 100%; padding: 22px 13px 14px; border-radius: 20px; background: #1b1d21; box-shadow: 0 30px 50px -26px rgba(0, 0, 0, 0.55); }
  .cam { position: absolute; top: 8px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #3a3f47; }
  .led { position: absolute; top: 9.5px; left: calc(50% + 14px); width: 5px; height: 5px; border-radius: 50%; background: #ef3a2d; box-shadow: 0 0 8px 2px rgba(239, 58, 45, 0.5); }
  .screen { position: relative; aspect-ratio: 16 / 10; border-radius: 4px; background: #000; }
  .word { position: absolute; left: 0; right: 0; top: 17%; display: grid; grid-template-columns: 1fr auto 1fr; color: #f2f2f2; font-weight: 600; font-size: 64px; line-height: 1.2; }
  .word .pre { text-align: right; } .word .pivot { color: #ff3b30; }
  .tick { position: absolute; left: 50%; width: 3px; height: 13px; margin-left: -1.5px; background: rgba(255, 255, 255, 0.42); border-radius: 2px; }
  .t1 { top: calc(17% - 12px); } .t2 { top: calc(17% + 82px); }
  .cue { position: absolute; left: 0; right: 0; top: calc(17% - 42px); text-align: center; color: rgba(255, 255, 255, 0.42); font-style: italic; font-size: 19px; }
  .neck { width: 18%; height: 30px; background: linear-gradient(#aab0b8, #c3c8cf); clip-path: polygon(22% 0, 78% 0, 90% 100%, 10% 100%); }
  .foot { width: 44%; height: 9px; border-radius: 5px; background: #c3c8cf; }
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="tally"></span>Суфлёр</div>
    <h1>Читайте с экрана и смотрите в камеру</h1>
    <p>Слова по одному прямо под камерой. Паузы и акценты — разметкой в тексте. Видео пишется в браузере.</p>
    <div class="url">sufler.artemslizhik.com</div>
  </div>
  <div class="monitor">
    <div class="body">
      <span class="cam"></span><span class="led"></span>
      <div class="screen">
        <div class="cue">(в камеру)</div>
        <i class="tick t1"></i>
        <div class="word"><span class="pre">Пр</span><span class="pivot">и</span><span class="post">вет</span></div>
        <i class="tick t2"></i>
      </div>
    </div>
    <div class="neck"></div>
    <div class="foot"></div>
  </div>
</body>
</html>
